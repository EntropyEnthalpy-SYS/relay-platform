name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-regression:
    name: Linux regression
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install native build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config clang libclang-dev openssl

      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
          rustc --version
          cargo --version

      - name: Run the regression suite
        run: sh scripts/verify.sh

      - name: Run all managed MPTCP cases on the runner kernel
        run: |
          cargo test --locked --test managed_mptcp --no-run --message-format=json > mptcp-build.jsonl
          python3 - <<'PY'
          import json, pathlib, platform, subprocess
          artifacts = [json.loads(line) for line in pathlib.Path('mptcp-build.jsonl').read_text().splitlines()]
          executable = next(row['executable'] for row in artifacts
                            if row.get('reason') == 'compiler-artifact'
                            and row['target']['name'] == 'managed_mptcp' and row.get('executable'))
          result = subprocess.run(['python3', 'scripts/check_linux_mptcp_compat.py',
                                   '--test-binary', executable,
                                   '--expected-kernel-prefix', platform.release(),
                                   '--output', 'mptcp-runner.json'])
          print(pathlib.Path('mptcp-runner.json').read_text())
          raise SystemExit(result.returncode)
          PY
