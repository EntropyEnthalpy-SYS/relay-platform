[package]
name = "relay-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
argon2 = "0.5"
axum = { version = "0.8.9", features = ["json", "tokio", "http1"] }
clap = { version = "4", features = ["derive"] }
ipnet = { version = "2", features = ["serde"] }
if-addrs = "0.15.0"
hickory-resolver = "0.26.1"
socket2 = { version = "0.6.5", features = ["all"] }
crc32c = "0.6"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "fallible_uint", "session"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
tower-http = { version = "0.6", features = ["limit", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
ring = "0.17"
blake3 = "1.8.7"
md-5 = "0.11.0"
aes = "0.9.3"
chacha20poly1305 = { version = "0.11.0", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nix = { version = "0.31.3", features = ["net", "socket", "uio"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
