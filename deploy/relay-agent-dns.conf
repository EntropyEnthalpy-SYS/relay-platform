# Optional: lets the Relay agent answer authoritative DNS on port 53 for the
# pool zones the panel assigns to this node (Optional features ->
# Authoritative DNS pool). Install as
#   /etc/systemd/system/relay-platform-agent.service.d/dns.conf
# then run: systemctl daemon-reload && systemctl restart relay-platform-agent
# The capability only allows binding ports below 1024; the agent still binds
# just the addresses listed for the member, never a wildcard. Also open UDP
# and TCP 53 in the firewall. Delete this file and restart to withdraw it.
[Service]
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
