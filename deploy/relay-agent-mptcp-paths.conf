# Optional: lets the Relay agent apply the MPTCP extra paths that the panel
# assigns to this node (Optional features -> MPTCP extra paths). Install as
#   /etc/systemd/system/relay-platform-agent.service.d/mptcp-paths.conf
# then run: systemctl daemon-reload && systemctl restart relay-platform-agent
# The agent then adds and removes only MPTCP endpoints with ids 200-207 and,
# when the panel sets them, the server-wide MPTCP limits. Endpoints configured
# by hand are left alone. Delete this file and restart to withdraw permission.
[Service]
AmbientCapabilities=CAP_NET_ADMIN
CapabilityBoundingSet=CAP_NET_ADMIN
# `ip mptcp` talks to the kernel over netlink.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
Environment=RELAY_MPTCP_PATHS=1
