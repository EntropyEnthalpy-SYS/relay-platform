# Optional: lets the Relay agent build the WireGuard networks that the panel
# assigns to this node (Optional features -> WireGuard networking). Install
# wireguard-tools (apt install wireguard-tools), install this file as
#   /etc/systemd/system/relay-platform-agent.service.d/wireguard.conf
# then run: systemctl daemon-reload && systemctl restart relay-platform-agent
# The agent then creates, changes and deletes only WireGuard links named
# rwg-*: their address, peers, MTU and, on a relay or device entry node,
# forwarding on that link alone. It never changes default routes, policy
# rules, firewall rules or server-wide settings. A node with a public
# endpoint also needs its UDP port (51820 unless changed) open in the
# firewall. Delete this file and restart to withdraw permission; links
# already made stay until removed with: ip link del rwg-XXXXXXXX
[Service]
AmbientCapabilities=CAP_NET_ADMIN
CapabilityBoundingSet=CAP_NET_ADMIN
# `ip` and `wg` talk to the kernel over netlink.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
Environment=RELAY_WIREGUARD=1
